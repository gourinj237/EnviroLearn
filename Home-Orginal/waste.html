<!DOCTYPE html>
<html>
<head>
    <title>Waste Segregation Game</title>
    <link rel="stylesheet" href="wastestyle.css">
</head>

<body>

<h1>♻ Waste Segregation Game ♻</h1>

<div id="scoreBoard">
    Score: <span id="score">0</span>
</div>

<div id="gameArea">

    <div id="itemArea">
        <p id="instruction">Drag this item to the correct bin</p>

        <img id="wasteItem" draggable="true">

        <p id="itemName"></p>

        <!-- Feedback message -->
        <p id="feedback"></p>
    </div>

    <div id="bins">
        <div class="bin" data-type="dry">
            <img src="blue.jpeg">
            <p>Dry Waste</p>
        </div>

        <div class="bin" data-type="wet">
            <img src="green.jpeg">
            <p>Wet Waste</p>
        </div>

        <div class="bin" data-type="ewaste">
            <img src="red.jpeg">
            <p>E-Waste</p>
        </div>
    </div>

</div>

<div id="finalScreen" class="hidden">
    <h2 id="finalMessage"></h2>
    <button onclick="restartGame()">Play Again</button>
</div>

<script src="waste.js"></script>

</body>
</html>
