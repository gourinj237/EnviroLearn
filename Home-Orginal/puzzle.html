<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Sliding Puzzle</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Courier New', Courier, monospace;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background-image: url('wallpaper.jpg');
    background-repeat: no-repeat;
    background-position: cover;
    background-attachment: fixed;
}

.game-container{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{
    margin-bottom:15px;
}

.stats{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-weight:bold;
}

.puzzle{
    display:grid;
    grid-template-columns: repeat(3, 120px);
    grid-template-rows: repeat(3, 120px);
    gap:4px;
    margin:auto;
}

.tile{
    width:120px;
    height:120px;
    cursor:pointer;
    background-size:360px 360px;
    border-radius:10px;
    transition:0.2s;
}

.tile:hover{
    transform:scale(1.05);
}

.empty{
    background:none;
    cursor:default;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    background:#00b894;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#019875;
}

.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:24px;
    flex-direction:column;
    display:none;
}
</style>
</head>

<body>

<div class="game-container">
    <h1>Eco Puzzle</h1>

    <div class="stats">
        <div>⏱ Time: <span id="timer">60</span>s</div>
        <div>Moves: <span id="moves">0</span></div>
    </div>

    <div class="puzzle" id="puzzle"></div>

    <button onclick="startGame()">Restart Game</button>
</div>

<div class="overlay" id="overlay">
    <div id="message"></div>
    <button onclick="startGame()">Play Again</button>
</div>

<script>
let tiles = [];
let moves = 0;
let timeLeft = 60;
let timerInterval;

const puzzle = document.getElementById("puzzle");
const timerDisplay = document.getElementById("timer");
const movesDisplay = document.getElementById("moves");
const overlay = document.getElementById("overlay");
const message = document.getElementById("message");

const imageUrl = "logo.png"; // 🔥 Replace with your image

function startGame(){
    tiles = [0,1,2,3,4,5,6,7,8];
    shuffleTiles();
    moves = 0;
    timeLeft = 60;
    movesDisplay.innerText = moves;
    timerDisplay.innerText = timeLeft;
    overlay.style.display = "none";
    clearInterval(timerInterval);
    startTimer();
    renderPuzzle();
}

function shuffleTiles(){
    for(let i=tiles.length-1;i>0;i--){
        let j = Math.floor(Math.random()*(i+1));
        [tiles[i],tiles[j]] = [tiles[j],tiles[i]];
    }
}

function renderPuzzle(){
    puzzle.innerHTML="";
    tiles.forEach((tile,index)=>{
        const div = document.createElement("div");
        div.classList.add("tile");

        if(tile === 8){
            div.classList.add("empty");
        }else{
            let x = (tile % 3) * -120;
            let y = Math.floor(tile / 3) * -120;
            div.style.backgroundImage = `url(${imageUrl})`;
            div.style.backgroundPosition = `${x}px ${y}px`;
        }

        div.addEventListener("click",()=>moveTile(index));
        puzzle.appendChild(div);
    });
}

function moveTile(index){
    const emptyIndex = tiles.indexOf(8);

    const validMoves = [
        emptyIndex-1,
        emptyIndex+1,
        emptyIndex-3,
        emptyIndex+3
    ];

    if(validMoves.includes(index) &&
       !(emptyIndex%3===0 && index===emptyIndex-1) &&
       !(emptyIndex%3===2 && index===emptyIndex+1)){
        [tiles[index],tiles[emptyIndex]] =
        [tiles[emptyIndex],tiles[index]];
        moves++;
        movesDisplay.innerText = moves;
        renderPuzzle();
        checkWin();
    }
}

function checkWin(){
    if(tiles.join() === "0,1,2,3,4,5,6,7,8"){
        endGame(true);
    }
}

function startTimer(){
    timerInterval = setInterval(()=>{
        timeLeft--;
        timerDisplay.innerText = timeLeft;
        if(timeLeft<=0){
            endGame(false);
        }
    },1000);
}

function endGame(won){
    clearInterval(timerInterval);
    overlay.style.display="flex";
    if(won){
        message.innerText = "🎉 You Won in " + moves + " moves!";
    }else{
        message.innerText = "⏰ Time's Up! Try Again!";
    }
}

startGame();
</script>

</body>
</html>
