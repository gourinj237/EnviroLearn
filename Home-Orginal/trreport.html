<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnviroLearn | Student Dashboard</title>

<style>
:root {
  --green:#2ecc71;
  --dark-green:#27ae60;
  --blue:#3498db;
  --bg:#f4f7f6;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  margin: 0;
}

.container {
  max-width: 1000px;
  margin: 20px auto;
  padding: 20px;
}

/* HEADER */
header {
  background: linear-gradient(to right, #4caf50, #2e7d32);
  color: white;
  padding: 20px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}

.avatar {
  font-size: 45px;
  margin-right: 20px;
}

.badge {
  background: gold;
  color: black;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: bold;
}

/* GRID */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h3 {
  margin-top: 0;
  border-bottom: 2px solid #eee;
  padding-bottom: 8px;
}

/* ITEMS */
.item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 12px 0;
}

.progress-bar {
  width: 100px;
  height: 10px;
  background: #ddd;
  border-radius: 5px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--green);
}

.score {
  background: var(--blue);
  color: white;
  padding: 4px 8px;
  border-radius: 6px;
}

.reward {
  font-size: 18px;
  color: #ff9800;
}

@media(max-width:768px){
  .dashboard-grid{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<script>
/* ASK NAME ON FIRST VISIT */
if(!localStorage.getItem("studentName")){
  let n = prompt("Enter Student Name:");
  localStorage.setItem("studentName", n || "Eco Student");
}
</script>

<div class="container">

<header>
  <div class="avatar">🌿</div>
  <div>
    <h1 id="studentName"></h1>
    <p>
      Badge: <span id="badge" class="badge"></span> |
      Total Points: <strong id="totalPoints">0</strong>
    </p>
  </div>
</header>

<div class="dashboard-grid">

  <!-- VIDEO PROGRESS -->
  <div class="card">
    <h3>🎥 Video Progress</h3>
    <div id="videoSection"></div>
  </div>

  <!-- QUIZ SCORES -->
  <div class="card">
    <h3>📝 Quiz Scores</h3>
    <div id="quizSection"></div>
  </div>

  <!-- REWARDS -->
  <div class="card">
    <h3>🏆 Rewards Earned</h3>
    <div id="rewardSection"></div>
  </div>

  <!-- IMPACT -->
  <div class="card">
    <h3>🌍 Your Planet Impact</h3>
    <ul id="impactList"></ul>
  </div>

</div>
</div>

<script>
/* LOAD DATA */
let data = JSON.parse(localStorage.getItem("ecoProgress")) || {
  videos:{},
  quizzes:{},
  rewards:{}
};

let totalPoints = 0;

/* STUDENT NAME */
let sName = localStorage.getItem("studentName");
document.getElementById("studentName").innerText =  sName + "'s Report";

/* VIDEO SECTION */
const videoDiv = document.getElementById("videoSection");
if(Object.keys(data.videos).length === 0){
  videoDiv.innerHTML = "<p>No videos completed yet</p>";
}else{
  for(let v in data.videos){
    videoDiv.innerHTML += `
    <div class="item-row">
      <span>${v}</span>
      <div class="progress-bar">
        <div class="progress-fill" style="width:100%"></div>
      </div>
      <span>✅</span>
    </div>`;
  }
}

/* QUIZ SECTION */
const quizDiv = document.getElementById("quizSection");
if(Object.keys(data.quizzes).length === 0){
  quizDiv.innerHTML = "<p>No quizzes attempted yet</p>";
}else{
  for(let q in data.quizzes){
    quizDiv.innerHTML += `
    <div class="item-row">
      <span>${q}</span>
      <span class="score">${data.quizzes[q]}</span>
    </div>`;
    totalPoints += data.quizzes[q];
  }
}

/* REWARDS */
const rewardDiv = document.getElementById("rewardSection");
if(Object.keys(data.rewards).length === 0){
  rewardDiv.innerHTML = "<p>No rewards earned yet</p>";
}else{
  for(let r in data.rewards){
    rewardDiv.innerHTML += `
    <div class="item-row reward">
      ${r} : ${data.rewards[r]}
    </div>`;
  }
}

/* BADGE LOGIC */
function getBadge(points){
  if(points >= 61) return "🏆 Planet Protector";
  if(points >= 31) return "🌍 Eco Hero";
  if(points >= 11) return "🌿 Eco Learner";
  return "🌱 Beginner";
}

document.getElementById("badge").innerText = getBadge(totalPoints);
document.getElementById("totalPoints").innerText = totalPoints;

/* IMPACT */
document.getElementById("impactList").innerHTML = `
<li><strong>${Object.keys(data.videos).length * 5}</strong> Virtual Trees Saved 🌳</li>
<li><strong>${totalPoints * 2}</strong> Litres of Water Saved 💧</li>
`;
</script>

</body>
</html>
