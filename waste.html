<!DOCTYPE html>
<html>
<head>
    <title>Waste Segregation Game</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            background-image: url("back.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        h1 {
            margin-top: 20px;
        }

        #scoreBoard {
            font-size: 26px;
            font-weight: bold;
            background: #ffffffee;
            padding: 12px 28px;
            border-radius: 14px;
            display: inline-block;
            margin: 15px 0;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }

        #wasteItem {
            width: 170px;
            margin: 12px;
            cursor: grab;
            transition: transform .2s;
        }

        #wasteItem:hover {
            transform: scale(1.12);
        }

        #feedback {
            height: 24px;
            font-weight: bold;
            margin-top: 6px;
        }

        #bins {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-top: 25px;
        }

        .bin img {
            width: 135px;
        }

        .bin {
            border-radius: 15px;
            padding: 10px;
        }

        .bin.hovered {
            background: #ecffe9;
        }

        .hidden {
            display: none;
        }

        #finalScreen {
            margin-top: 80px;
        }

        #finalScreen h2 {
            font-size: 32px;
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            background: #2e7d32;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }
    </style>
</head>

<body>

<h1>♻ Waste Segregation Game ♻</h1>

<div id="scoreBoard">
    Score: <span id="score">0</span>
</div>

<div id="gameArea">

    <div id="itemArea">
        <p id="instruction">Drag this item to the correct bin</p>

        <img id="wasteItem" draggable="true">

        <p id="itemName"></p>

        <p id="feedback"></p>
    </div>

    <div id="bins">
        <div class="bin" data-type="dry">
            <img src="blue.jpeg">
            <p>Dry Waste</p>
        </div>

        <div class="bin" data-type="wet">
            <img src="green.jpeg">
            <p>Wet Waste</p>
        </div>

        <div class="bin" data-type="ewaste">
            <img src="red.jpeg">
            <p>E-Waste</p>
        </div>
    </div>

</div>

<div id="finalScreen" class="hidden">
    <h2 id="finalMessage"></h2>
    <button onclick="restartGame()">Play Again</button>
</div>

<script src="waste.js"></script>

</body>
</html>
