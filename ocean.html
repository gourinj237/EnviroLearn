<!DOCTYPE html>
<html>
<head>
    <title>Clean The Ocean</title>
    <style>
        body{
            margin:0;
            font-family:'Courier New', Courier, monospace;
            background:url("ocean-bg1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .screen{
            position:absolute;
            width:100%;
            height:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:rgba(0,0,0,0.55);
            color:white;
            text-align:center;
        }

        .panel{
            background:rgba(0,0,0,0.6);
            padding:40px;
            border-radius:18px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        .hidden{
            display:none;
        }

        #topbar{
            position:absolute;
            top:15px;
            left:50%;
            transform:translateX(-50%);
            background:rgba(0,0,0,0.7);
            color:white;
            padding:12px 28px;
            border-radius:20px;
            font-size:20px;
            font-weight:bold;
            z-index:2;
        }

        #ocean{
            position:absolute;
            width:100%;
            height:100%;
        }

        .object{
            position:absolute;
            width:10vw;
            max-width:170px;
            min-width:150px;
            cursor:pointer;
            animation:float 4s ease-in-out infinite alternate;
        }

        @keyframes float{
            from{ transform:translateY(0px);}
            to{ transform:translateY(-20px);}
        }

        button{
            padding:12px 25px;
            font-size:18px;
            border:none;
            border-radius:10px;
            background:#00c896;
            color:white;
            cursor:pointer;
        }

        button:hover{
            background:#00a87d;
        }
    </style>
</head>

<body>

<div id="startScreen" class="screen">
    <div class="panel">
        <h1>🌊 Clean The Ocean!</h1>
        <p>
            🌊 Mission: Clean the Ocean!<br>
            Tap the trash before it drifts away 🧹 (+10 points)<br>
            Protect marine life — don’t hurt the animals 🐠 (-5 points)<br>
            You have 60 seconds… let’s see how much you can save! 💙
        </p>
        <button id="startBtn">Start Game</button>
    </div>
</div>

<div id="gameUI" class="hidden">
    <div id="topbar">
        Score: <span id="score">0</span>
        |
        Time: <span id="time">60</span>
    </div>
    <div id="ocean"></div>
</div>

<div id="endScreen" class="screen hidden">
    <div class="panel">
        <h1>🌊 Ocean Hero 🐬</h1>
        <h2 id="finalScore"></h2>
        <p id="message"></p>
        <button onclick="location.reload()">Play Again</button>
    </div>
</div>

<script src="ocean.js"></script>
</body>
</html>
