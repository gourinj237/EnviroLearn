<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Environmental Video Quiz</title>
  <style>
    body {
      font-family:  'Courier New', Courier, monospace, sans-serif;
     
      background-color: #82eda6; 
      background-image: url("quiz.jpeg");
      background-size: cover;
      background-position: center;
       min-height: 100vh;
      background-attachment: fixed;
      text-align: center;
      padding: 40px;
      margin: 0;
    }

    
    #categoryMenu, #quizBox, #finalScreen {
      max-width: 500px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

   
    #categoryMenu, #finalScreen {
      background-color: rgba(255, 255, 255, 0.95);
    }

   
    #quizBox {
      display: none;
      background-color: #51afd7; 
      border: 4px solid #4CAF50;
     background-image:url("new.jpeg") ;
     
    }

    
    button {
      display: block;
      margin: 12px auto;
      padding: 14px;
      width: 280px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background-color: white;
      color: #333;
      border: 2px solid #2196F3;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #e3f2fd;
      transform: translateY(-2px);
    }

    .selected {
      background-color: #2196F3 !important;
      color: white !important;
    }

   
    .trophy { font-size: 80px; margin-bottom: 10px; }
    .flowers { font-size: 50px; margin: 15px 0; }

    #finalScreen { display: none; }
    #result { font-weight: bold; font-size: 18px; margin-top: 15px; }
  </style>
</head>
<body>

<div id="categoryMenu">
  <h1>Environmental Quiz 🌍</h1>
  <p>Choose a topic to begin:</p>
  <button onclick="startQuiz('pollution')" style="border-color: #757575;">💨 Pollution</button>
  <button onclick="startQuiz('warming')" style="border-color: #FF5722;">🌡️ Global Warming</button>
  <button onclick="startQuiz('biodiversity')" style="border-color: #4CAF50;">🦋 Biodiversity</button>
</div>

<div id="quizBox">
  <h2 id="quizTitle" style="color: #2e7d32;">Topic</h2>
  <hr style="border: 0; border-top: 1px solid #eee;">
  <p id="question" style="font-size: 20px; color: #333;"></p>

  <button id="opt1" onclick="checkAnswer(0)"></button>
  <button id="opt2" onclick="checkAnswer(1)"></button>
  <button id="opt3" onclick="checkAnswer(2)"></button>

  <p id="result"></p>
  <p id="scoreText" style="font-size: 18px; font-weight: bold;">Score: 0</p>

  <button onclick="nextQuestion()" style="background-color: #2196F3; color: white; border: none; margin-top: 20px;">Next Question ➔</button>
</div>

<div id="finalScreen">
  <div id="finalTrophy" class="trophy"></div>
  <h2>Congratulations!</h2>
  <p id="completionMsg">You have completed the quiz.</p>

  <div id="finalEmojis" class="flowers"></div>

  <h3 id="finalScoreDisplay" style="font-size: 24px; color: #2196F3;"></h3>
 <p id="thankYouText">Thank you for protecting our Earth 💚</p>

  
  <button onclick="location.reload()" style="background: #eee; border: 1px solid #ccc; width: 200px;">Try Another Topic</button>
</div>

<script>
let score = 0;
let current = 0;
let answered = false;
let activeQuestions = [];

const allQuestions = {
  pollution: [
    { q: "Which causes air pollution?", options: ["Vehicle smoke", "Trees", "Rain"], answer: 0 },
    { q: "Which is a major pollutant?", options: [ "Fresh air", "Sunlight","Plastic waste"], answer: 2},
    { q: "Which causes water pollution?", options: ["Trees", "Plastic & industrial waste",  "vechicles"], answer: 1 },
    {  q: "Which waste pollutes rivers and oceans?", options: [ "Leaves", "Sand","Plastic waste"], answer: 2 },
     { q: "How can pollution be reduced?", options: [ "Throwing waste", "Planting trees","Burning plastic"], answer: 1 }
 ],

  warming: [
    { q: "Which gas causes global warming?", options: ["CO₂", "Oxygen", "Nitrogen"], answer: 0 },
    { q: "Which activity increases global warming?", options: ["Planting trees", "Deforestation", "Recycling"], answer: 1 },
    { q: "What happens when ice caps melt?", options: [ "Earth cools","Sea level rises", "More forests grow"], answer: 1 },
    { q: "How can we reduce global warming?", options: ["Waste electricity","Cut more trees","Use renewable energy"], answer: 2 },
    { q: "What causes Earth’s temperature to rise?", options: [ "Moonlight", "Wind","Greenhouse gases"], answer: 2 }
  ],
  biodiversity: [
    { q: "Biodiversity means?", options: ["Only animals", "Variety of life", "Only plants"], answer: 1 },
    { q: "Which helps protect biodiversity?", options: ["Cutting forests", "Pollution", "Conserving habitats"], answer: 2 },
     { q: "Why is biodiversity important?", options: [ "Causes pollution", "Reduces food","Maintains balance in nature"], answer: 2 },
    { q: "What harms biodiversity?", options: ["Wildlife protection", "Deforestation","Tree planting"], answer: 1 },
   { q: "What happens if species disappear?", options: ["Ecosystem gets disturbed", "Nature improves", "Nothing changes"], answer: 0 }
  ],
};

function startQuiz(category) {
  activeQuestions = allQuestions[category];
  current = 0;
  score = 0;
  
  // Set the Heading
  const displayNames = {pollution: "Pollution Quiz", warming: "Global Warming Quiz", biodiversity: "Biodiversity Quiz"};
  document.getElementById("quizTitle").innerText = displayNames[category];

  // Switch Screens
  document.getElementById("categoryMenu").style.display = "none";
  document.getElementById("quizBox").style.display = "block";
  
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  document.getElementById("result").innerText = "";
  document.getElementById("scoreText").innerText = "Score: " + score;

  ["opt1","opt2","opt3"].forEach(id => {
    document.getElementById(id).classList.remove("selected");
  });

  let qData = activeQuestions[current];
  document.getElementById("question").innerText = qData.q;
  document.getElementById("opt1").innerText = qData.options[0];
  document.getElementById("opt2").innerText = qData.options[1];
  document.getElementById("opt3").innerText = qData.options[2];
}

function checkAnswer(option) {
  if (answered) return;
  answered = true;

  document.getElementById("opt" + (option + 1)).classList.add("selected");

  if (option === activeQuestions[current].answer) {
    score += 10;
    document.getElementById("result").innerText = "✅ Correct!";
    document.getElementById("result").style.color = "green";
  } else {
    document.getElementById("result").innerText = "❌ Incorrect";
    document.getElementById("result").style.color = "red";
  }
  document.getElementById("scoreText").innerText = "Score: " + score;
}

function nextQuestion() {
  if (!answered) {
    alert("Please select an answer first!");
    return;
  }

  current++;
  if (current < activeQuestions.length) {
    loadQuestion();
  } else {
    showFinalScreen();
  }
}

function showFinalScreen() {
  document.getElementById("quizBox").style.display = "none";
  document.getElementById("finalScreen").style.display = "block";
  
  const trophyDiv = document.getElementById("finalTrophy");
  const emojiDiv = document.getElementById("finalEmojis");
  const totalQuestions = activeQuestions.length;
  const maxPossibleScore = totalQuestions * 10;

  // Logic for Trophy and Earth Smiles
  if (score === maxPossibleScore) {
    // 🥇 GOLD: Perfect Score
    trophyDiv.innerHTML = "🏆"; 
    emojiDiv.innerHTML = "🌍 😊 🌍";
  } 
  else if (score >= (maxPossibleScore / 2)) {
    // 🥈 SILVER: 50% or higher
    trophyDiv.innerHTML = "🥈";
    emojiDiv.innerHTML = "🌍 😊 🌍";
  } 
  else {
    // 🥉 BRONZE: Less than 50%
    trophyDiv.innerHTML = "😔";
    emojiDiv.innerHTML = " 😢 🌍 💔 ";
  }
if (score <= 20) {
  document.getElementById("finalScoreDisplay").innerText =
    "😔 Your Final Score: " + score + "\nBest try! Try next time 💪🌱";
  document.getElementById("thankYouText").style.display = "none";
} else {
  document.getElementById("finalScoreDisplay").innerText =
    "Your Final Score: " + score;
  document.getElementById("thankYouText").style.display = "block";
}

}
</script>

</body>
</html>
